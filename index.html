<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" sizes="180x180" href="iconos/180.png">
  <link rel="apple-touch-icon" href="iconos/192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="estilos.css">
  <title>ONE</title>
</head>
<body>
  <header class="cabecera">
    <button class="boton-volver" data-test="volver" aria-label="Volver" hidden>←</button>
    <span class="cabecera-logo">🧠 ONE</span>
    <div class="cabecera-estado">
      <span class="cabecera-modo-area" data-test="modo-area" hidden></span>
      <span class="cabecera-racha" data-test="racha">🔥 0</span>
      <span class="cabecera-nivel" data-test="nivel-partida">Nivel 1</span>
    </div>
  </header>

  <main id="app">
    <!-- INICIO: solo los dos emojis (🧠 lleva al HUB, 💪 apagado = "pronto"). Sin
         botón Jugar: desde aquí nunca se juega directamente, se entra al HUB. -->
    <section class="vista vista-inicio" data-vista="inicio">
      <div class="fondo-dinamico" aria-hidden="true">
        <div class="fondo-luz"></div>
        <div class="fondo-vineta"></div>
      </div>
      <div class="inicio-centro">
        <div class="inicio-emojis">
          <button class="inicio-emoji-boton" data-test="cerebro" aria-label="Entrar a ONE">
            <span class="inicio-emoji">🧠</span>
          </button>
          <button class="inicio-emoji-boton inicio-emoji-boton--apagado" data-test="cuerpo" aria-label="CUERPO, próximamente">
            <span class="inicio-emoji">💪</span>
            <span class="inicio-etiqueta-pronto">pronto</span>
          </button>
        </div>
        <p class="inicio-aviso" id="aviso-cuerpo" hidden>Pronto: CUERPO</p>
        <div class="inicio-mini-stats">
          <span data-test="racha-inicio">🔥 0</span>
          <span data-test="nivel-inicio">Nivel 1</span>
        </div>
      </div>
    </section>

    <section class="vista" data-vista="pregunta" data-test="pregunta" hidden>
      <div class="barra-progreso">
        <div class="barra-progreso-relleno" id="barra-progreso-relleno"></div>
      </div>
      <!-- MAZO: la tarjeta ES la vista (spec v0.1c §1, §4). Un mazo vertical de
           hasta 10 huecos, navegable deslizando arriba/abajo; montarMazo() (ver
           app.js) gestiona el gesto, los puntos laterales, el chevrón y las
           teclas. Cada tarjeta lleva su propia confianza y su propio feedback:
           nada de esto vive ya fuera de la tarjeta. -->
      <div id="mazo" class="mazo" data-test="mazo"></div>
    </section>

    <section class="vista vista-resumen" data-vista="resumen" data-test="resumen" hidden>
      <!-- Repaso vertical (spec v0.1c §6): el resumen ES un mazo de solo lectura,
           montado con montarMazo() (el mismo componente que la partida, ver
           app.js/construirMazoResumen). Tarjeta 0: cifras de la partida. 1..N:
           una por cada fallo/frágil, en estado respondida de solo lectura.
           Última: Otra partida / Inicio. -->
      <div id="mazo-resumen" class="mazo" data-test="repaso"></div>
    </section>

    <!-- REPASO del HUB (spec v0.2 §2, distinto del repaso de UNA partida de
         arriba): feed "sin fin" de TODO lo jugado, ordenado por prioridad de
         repaso (motor.js/ordenarRepaso) y filtrable por área. Fila de chips
         + mazo de solo lectura, montado con montarMazo() igual que el resto
         (app.js/renderRepaso). Se entra desde el botón "Repaso" del HUB. -->
    <section class="vista" data-vista="repaso" data-test="repaso-vista" hidden>
      <div class="repaso-filtro" data-test="repaso-filtro" role="group" aria-label="Filtrar por área"></div>
      <div id="mazo-repaso" class="mazo"></div>
    </section>

    <!-- HUB: sustituye a "Progreso". Se conservan data-vista="progreso" y
         data-test="progreso" en la sección para no romper referencias, aunque el
         título ya no es "Progreso": es la pantalla desde la que SIEMPRE se
         empieza a jugar (Comenzar al azar, la Misión de hoy, Pendientes, o una
         tarjeta de área = un nivel). Orden de arriba abajo: radar, KPIs, misión +
         pendientes, áreas (4×2), Comenzar (anclado abajo) y el pie. -->
    <section class="vista vista-hub" data-vista="progreso" data-test="progreso" hidden>
      <!-- Radar de las 8 áreas (150px, estilo panel de stats de videojuego): un eje
           por área, contorno = puntuación, relleno más opaco = solidez. -->
      <div class="hub-radar-envoltorio">
        <svg class="hub-radar" data-test="radar" viewBox="0 0 220 220" aria-hidden="true"></svg>
        <p class="radar-vacio" id="radar-vacio" hidden>Juega para dibujar tu perfil</p>
      </div>
      <div class="hub-kpis">
        <span class="hub-chip" data-test="kpi-aciertos-hoy">Hoy: 0/0</span>
        <span class="hub-chip" data-test="recuperadas">Recuperadas 0</span>
        <span class="hub-chip" data-test="calibracion" hidden></span>
      </div>
      <!-- Aviso breve (M1, ola final): "Nada que jugar con este filtro" cuando
           Misión de hoy/Pendientes resultan sin ninguna pregunta elegible. Oculto
           por defecto: no ocupa hueco (mostrarAvisoHub en app.js lo muestra ~1,6s). -->
      <p class="hub-aviso" id="aviso-hub" data-test="aviso-hub" hidden></p>
      <!-- Banco extendido (v0.2b2 §4): "N preguntas nuevas" tras una sincronización con el
           servidor que trajo preguntas todavía no vistas; desaparece al tocarlo (no hace falta
           más acción -- ya están mezcladas en el banco en memoria, ver app.js). -->
      <button type="button" class="hub-chip-nuevas" data-test="nuevas-servidor" hidden></button>
      <div class="hub-destacados">
        <button type="button" class="hub-destacado" data-test="mision" aria-disabled="true"></button>
        <button type="button" class="hub-destacado" data-test="pendientes" aria-disabled="true"></button>
        <button type="button" class="hub-destacado" data-test="repaso-hub" aria-disabled="true"></button>
      </div>
      <div id="progreso-areas" class="hub-grid"></div>
      <!-- Punto de estado del servidor de generación (v0.2b2 §4), junto a "Comenzar":
           gris = sin servidor configurado, verde = sincronizado hoy, ámbar = con servidor
           configurado pero el último intento falló. Silencioso a propósito -- sin servidor la
           app funciona exactamente igual, este punto es la única señal visible. -->
      <div class="hub-comenzar-fila">
        <button class="boton boton-principal boton-comenzar" data-test="comenzar">Comenzar</button>
        <!-- Tarea 4 ("Conectar desde la app instalada") + revisión combinada: antes un <span>
             decorativo -- ahora también el disparador para abrir la hoja "Conectar" (mismo
             manejador que su gemelo del Átomo, ver app.js), con área táctil ampliada a 44px sin
             agrandar el punto visible (estilos.css). Carlos aterriza en el HUB al abrir la app
             instalada, así que este es el punto que de verdad ve primero. `aria-label` estático
             solo hasta que `actualizarPuntoServidor()` lo sobrescriba con el estado real (mismo
             texto que el gris por defecto, tercera ronda de revisión combinada: el aria-label
             fijo "Estado del servidor" de la ronda anterior era un error, corregido -- debe seguir
             llevando el estado). -->
        <button
          type="button"
          class="punto-servidor"
          data-test="estado-servidor"
          data-estado="gris"
          aria-label="Servidor sin conectar, toca para conectar"
        ></button>
      </div>
      <div class="hub-pie">
        <button class="hub-pie-enlace" data-test="exportar">Exportar</button>
        <label class="hub-pie-enlace boton-archivo">
          Importar
          <input type="file" id="importar-archivo" accept="application/json" hidden>
        </label>
      </div>
    </section>

    <!-- ÁTOMO (spec v0.2b2 §4): se abre manteniendo pulsada una tarjeta de área del HUB (o con su
         botón "⚛", ver renderHub en app.js). Núcleo = área/subtema elegido en el centro del SVG,
         anillo de nodos alrededor con los subtemas del servidor; tocar un nodo avanza un anillo,
         tocar el núcleo retrocede uno. "←" de la cabecera (ya existente, manejarVolver) lleva
         siempre al HUB desde aquí -- ver ese mismo manejador en app.js, no hace falta otro. -->
    <section class="vista vista-atomo" data-vista="atomo" data-test="atomo" hidden>
      <!-- Ronda 1 de revisión (Important #4): la cabecera vive FUERA de .atomo-cuerpo, pegada
           arriba (flex-shrink:0 de .vista > *) -- antes estaba dentro y flotaba a media altura,
           porque .atomo-cuerpo centra su contenido en el espacio libre. -->
      <div class="atomo-cabecera">
        <span class="atomo-ruta" data-test="atomo-ruta"></span>
        <!-- Tarea 4 ("Conectar desde la app instalada"): antes un <span> decorativo -- ahora
             también el disparador para abrir la hoja "Conectar" (ver app.js), con área táctil
             ampliada a 44px sin agrandar el punto visible (estilos.css). `aria-label` estático
             solo hasta que `actualizarPuntoServidor()` lo sobrescriba con el estado real (ver el
             comentario del punto gemelo del HUB, arriba en esta hoja). -->
        <button
          type="button"
          class="punto-servidor"
          data-test="atomo-estado-servidor"
          data-estado="gris"
          aria-label="Servidor sin conectar, toca para conectar"
        ></button>
      </div>
      <!-- .atomo-cuerpo absorbe el espacio libre; el lienzo se queda arriba, pegado a la cabecera
           (Ronda final, Disposición) y el hueco que deja debajo se aprovecha para la ruta completa
           (legible, sin recortar) y una ayuda fija -- ya no queda un hueco muerto y vacío. -->
      <div class="atomo-cuerpo">
        <div class="atomo-lienzo" data-test="atomo-lienzo"></div>
        <p class="atomo-ruta-completa" data-test="atomo-ruta-completa"></p>
        <!-- Texto fijo por defecto; sin servidor configurado, app.js#actualizarAyudaAtomo lo
             cambia a la pista de conexión (Tarea 4). -->
        <p class="atomo-ayuda" data-test="atomo-ayuda">Mantén pulsada un área del HUB para abrir su átomo</p>
        <!-- Fila "mientras" (v0.2b3 Tarea 3, "Ampliación"): visible mientras el anillo carga,
             mientras falla, o mientras se genera una tanda en segundo plano -- ver
             app.js#actualizarFilaMientras. "Jugar el área" reutiliza empezarPartida({area}), la
             misma función que usa el HUB al tocar una tarjeta de área; "Repasar" abre la pantalla
             de repaso existente (abrirRepaso). -->
        <div class="atomo-mientras" data-test="atomo-mientras" hidden>
          <button type="button" class="boton" data-test="atomo-mientras-jugar">Jugar el área</button>
          <button type="button" class="boton" data-test="atomo-mientras-repasar">Repasar</button>
        </div>
        <!-- Adversarial A15: aria-live="polite" -- el texto cambia (conectar servidor / fallo al
             cargar subtemas) sin que el foco se mueva, así que un lector de pantalla no se
             enteraría sin esto. -->
        <p class="atomo-aviso" data-test="atomo-aviso" hidden aria-live="polite"></p>
        <button type="button" class="boton atomo-reintentar" data-test="atomo-reintentar" hidden>Reintentar</button>
      </div>
      <div class="atomo-acciones">
        <button type="button" class="boton" data-test="atomo-atras">Atrás</button>
        <button type="button" class="boton boton-principal" data-test="atomo-generar" disabled>Generar</button>
      </div>
    </section>

    <!-- ESPERA del Átomo (spec v0.2b2 §4): tarjeta a pantalla completa tras pulsar Generar, con el
         sondeo de /trabajo/:id corriendo en segundo plano (cada 5s, ver app.js) mientras el
         jugador sigue con otra cosa -- no hace falta quedarse en esta pantalla esperando. -->
    <section class="vista vista-atomo-espera" data-vista="atomo-espera" data-test="atomo-espera" hidden>
      <p class="atomo-espera-texto" data-test="atomo-espera-texto" aria-live="polite"></p>
      <div class="atomo-espera-acciones" data-test="atomo-espera-acciones">
        <button type="button" class="boton boton-principal" data-test="atomo-jugar-mientras">Jugar mientras</button>
        <button type="button" class="boton" data-test="atomo-repasar-mientras">Repasar mientras</button>
      </div>
      <!-- Ronda final de revisión (Critical #2): al llegar el resultado final (lista/fallida/tope
           de sondeos), esta tarjeta reacciona en vez de quedarse en "Generando... ~42 s" para
           siempre -- se ocultan los dos botones de arriba y aparece este único botón, con el texto
           y la acción que decida app.js#actualizarEsperaAtomoConResultado ("Jugar la tanda" ->
           empezarPartida, o "Volver" -> irAlHub). -->
      <button type="button" class="boton boton-principal atomo-espera-resultado" data-test="atomo-espera-resultado" hidden></button>
    </section>
  </main>

  <!-- Indicador de tanda (spec v0.2b4 §2): FUERA de <main>, fijo arriba a la derecha, así se ve en
       TODAS las vistas (inicio, HUB, partida, repaso, átomo, espera) mientras hay una tanda en
       curso o lista. SUSTITUYE al chip "tanda-lista" del HUB (una sola señal, decisión de la spec).
       Tocarlo: en curso abre la vista de espera del átomo; lista arranca la partida con esas
       preguntas; en fallo solo se cierra (y se cierra solo a los 6 s). -->
  <button type="button" class="indicador-tanda" data-test="indicador-tanda" hidden aria-live="polite">
    <svg class="indicador-tanda-anillo" viewBox="0 0 36 36" aria-hidden="true">
      <circle class="indicador-tanda-pista" cx="18" cy="18" r="15"></circle>
      <circle class="indicador-tanda-avance" data-test="indicador-tanda-anillo" cx="18" cy="18" r="15"></circle>
    </svg>
    <span class="indicador-tanda-texto" data-test="indicador-tanda-texto"></span>
  </button>

  <!-- Hoja "Conectar" (Tarea 4, v0.2b3: "Conectar desde la app instalada"): en iOS la app añadida a
       la pantalla de inicio tiene almacenamiento SEPARADO de Safari, así que el enlace de conexión
       abierto en Safari no llega a la app instalada -- esta hoja deja pegar el enlace (o
       "servidor token") a mano, sin salir de la app. Se abre al tocar el punto de estado de la
       cabecera del Átomo o su aviso "Conecta el servidor..." (ver app.js). -->
  <div class="hoja-conectar" data-test="conectar" hidden role="dialog" aria-label="Conectar servidor">
    <label class="hoja-conectar-etiqueta" for="conectar-texto">Pega aquí el enlace de conexión</label>
    <input
      type="text"
      id="conectar-texto"
      class="hoja-conectar-campo"
      inputmode="url"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      data-test="conectar-texto"
    >
    <!-- Ronda de revisión combinada (Tarea 4, Important): aria-live="polite" -- el texto aparece
         sin que el foco se mueva (se queda en el campo), así que un lector de pantalla no se
         enteraría del error sin esto (mismo criterio que atomo-aviso en la vista del Átomo). -->
    <p class="hoja-conectar-error" data-test="conectar-error" hidden aria-live="polite">Enlace no válido</p>
    <div class="hoja-conectar-acciones">
      <button type="button" class="boton" data-test="conectar-cancelar">Cancelar</button>
      <button type="button" class="boton boton-principal" data-test="conectar-ok">Conectar</button>
    </div>
  </div>
  <!-- Aviso "Conectado" (Tarea 4): la hoja de arriba ya se ha cerrado en ese momento, así que este
       vive fuera de ella -- fijo y centrado, visible encima de cualquier vista, 2s (ver
       app.js#mostrarAvisoConectado). -->
  <p class="aviso-conectado" data-test="conectar-hecho" hidden aria-live="polite">Conectado</p>

  <!-- Ver a pantalla completa (spec §8 "Ver a pantalla completa", Tarea 3): un toque en la visual
       protagonista de una tarjeta revelada (imagen, visual de datos o tarjeta tipográfica) abre esto
       -- FUERA de <main>, mismo precedente que la hoja "Conectar" de arriba (una hoja modal), pero a
       PANTALLA COMPLETA entera: fondo #000, `position:fixed;inset:0`, por encima de todo (z-index 30,
       la más alta usada hasta ahora en esta hoja -- ver estilos.css). Mientras está abierta captura
       todos los eventos: el mazo de debajo no recibe gestos. Contenido dinámico (clon de la `img` o
       del `svg` tocados + su pie) lo construye app.js#abrirVisualCompleta en cada apertura -- aquí
       solo el armazón vacío.
       Ronda 1 de revisión (Important #2/#3): la propia superposición tapa físicamente la cabecera de
       debajo (la flecha "←" del header dejó de ser alcanzable por un toque real -- confirmado con
       elementFromPoint en vivo por el revisor), así que ya no se intercepta esa flecha (ver
       manejarVolver en app.js, ya sin esa rama muerta): el botón `.visual-completa-cerrar` de aquí es
       el cierre por gesto explícito, y además el ÚNICO elemento enfocable del diálogo (foco al abrir,
       Tab/Shift+Tab lo mantienen ahí -- ver el keydown de app.js -- y devolución del foco a la zona
       que abrió la superposición al cerrar). -->
  <div class="visual-completa" data-test="visual-completa" hidden role="dialog" aria-label="Visual a pantalla completa">
    <button type="button" class="visual-completa-cerrar" data-test="visual-cerrar" aria-label="Cerrar">←</button>
    <div class="visual-completa-medio" data-test="visual-completa-medio"></div>
    <div class="visual-completa-pie" data-test="visual-completa-pie" hidden></div>
  </div>

  <!-- Plantilla clonada por cada tarjeta del mazo (spec v0.1c §2.3): confianza
       dentro de la tarjeta, tras el enunciado y antes de las opciones. -->
  <template id="plantilla-confianza">
    <div class="confianza-fila">
      <span class="confianza-etiqueta" data-test="confianza-etiqueta">Confianza</span>
      <div class="confianza" data-test="confianza" role="group" aria-label="Nivel de confianza">
        <button type="button" class="confianza-opcion" data-test="confianza-baja" aria-pressed="false">Baja</button>
        <button type="button" class="confianza-opcion confianza-opcion--activa" data-test="confianza-media" aria-pressed="true">Media</button>
        <button type="button" class="confianza-opcion" data-test="confianza-alta" aria-pressed="false">Alta</button>
      </div>
    </div>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
