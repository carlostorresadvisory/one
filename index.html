<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" sizes="180x180" href="iconos/180.png">
  <link rel="apple-touch-icon" href="iconos/192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="estilos.css">
  <title>ONE</title>
</head>
<body>
  <header class="cabecera">
    <button class="boton-volver" data-test="volver" aria-label="Volver" hidden>←</button>
    <span class="cabecera-logo">🧠 ONE</span>
    <div class="cabecera-estado">
      <span class="cabecera-modo-area" data-test="modo-area" hidden></span>
      <span class="cabecera-racha" data-test="racha">🔥 0</span>
      <span class="cabecera-nivel" data-test="nivel-partida">Nivel 1</span>
    </div>
  </header>

  <main id="app">
    <!-- INICIO: solo los dos emojis (🧠 lleva al HUB, 💪 apagado = "pronto"). Sin
         botón Jugar: desde aquí nunca se juega directamente, se entra al HUB. -->
    <section class="vista vista-inicio" data-vista="inicio">
      <div class="fondo-dinamico" aria-hidden="true">
        <div class="fondo-luz"></div>
        <div class="fondo-vineta"></div>
      </div>
      <div class="inicio-centro">
        <div class="inicio-emojis">
          <button class="inicio-emoji-boton" data-test="cerebro" aria-label="Entrar a ONE">
            <span class="inicio-emoji">🧠</span>
          </button>
          <button class="inicio-emoji-boton inicio-emoji-boton--apagado" data-test="cuerpo" aria-label="CUERPO, próximamente">
            <span class="inicio-emoji">💪</span>
            <span class="inicio-etiqueta-pronto">pronto</span>
          </button>
        </div>
        <p class="inicio-aviso" id="aviso-cuerpo" hidden>Pronto: CUERPO</p>
        <div class="inicio-mini-stats">
          <span data-test="racha-inicio">🔥 0</span>
          <span data-test="nivel-inicio">Nivel 1</span>
        </div>
      </div>
    </section>

    <section class="vista" data-vista="pregunta" data-test="pregunta" hidden>
      <div class="barra-progreso">
        <div class="barra-progreso-relleno" id="barra-progreso-relleno"></div>
      </div>
      <div id="contenedor-pregunta"></div>
      <!-- Selector de confianza (sustituye a IDK, spec "que se note" 12-sep): tres
           segmentos, Media por defecto, se reinicia en cada pregunta y desaparece
           al responder (ver renderPreguntaActual/mostrarFeedback en app.js). -->
      <div class="confianza" data-test="confianza" role="group" aria-label="Nivel de confianza">
        <button type="button" class="confianza-opcion" data-test="confianza-baja" aria-pressed="false">Baja</button>
        <button type="button" class="confianza-opcion confianza-opcion--activa" data-test="confianza-media" aria-pressed="true">Media</button>
        <button type="button" class="confianza-opcion" data-test="confianza-alta" aria-pressed="false">Alta</button>
      </div>
      <div id="contenedor-feedback" class="feedback" hidden>
        <p id="feedback-texto" class="feedback-texto"></p>
        <p id="feedback-combo" class="feedback-combo" hidden></p>
        <p id="cambio-nivel-texto" class="cambio-nivel" data-test="cambio-nivel" hidden></p>
        <p id="cambio-nivel-area-texto" class="cambio-nivel-area" data-test="cambio-nivel-area" hidden></p>
        <!-- Chips de feedback compacto: cada uno oculto salvo que aplique (ver
             mostrarFeedback en app.js). -->
        <div class="feedback-chips" id="feedback-chips">
          <span class="feedback-chip" id="chip-recuperada" data-test="recuperada" hidden></span>
          <span class="feedback-chip" id="chip-alta-fallo" data-test="confianza-alta-fallo" hidden>Estabas seguro → Pendientes</span>
          <span class="feedback-chip" id="chip-mision-completada" data-test="mision-completada" hidden>Misión completada</span>
          <span class="feedback-chip" id="chip-fragil" data-test="fragil" hidden>Frágil: volverá pronto</span>
        </div>
        <p id="explicacion-texto" class="explicacion" hidden></p>
        <p id="reportada-texto" class="reportada" hidden>Anotado</p>
        <!-- "¿por qué?": solo existe dentro del feedback, así que solo aparece tras responder. -->
        <div class="fila-acciones-pregunta">
          <button class="boton-accion-cuadrado boton-accion-cuadrado--signo" data-test="porque" aria-label="¿Por qué?">?</button>
          <button class="enlace-discreto" data-test="esta-mal">esta pregunta está mal</button>
        </div>
        <button class="boton boton-principal" data-test="siguiente">Siguiente</button>
      </div>
    </section>

    <section class="vista vista-resumen" data-vista="resumen" data-test="resumen" hidden>
      <h2>Resumen</h2>
      <p id="resumen-aciertos" class="resumen-linea"></p>
      <p id="resumen-xp" class="resumen-linea"></p>
      <p id="resumen-areas" class="resumen-linea"></p>
      <!-- "Para repasar" (spec "que se note"): carrusel horizontal de las preguntas
           falladas o acertadas con confianza Baja de esta partida (ver renderRepaso
           en app.js). Ocupa el espacio restante (flex:1) para que el resumen quepa
           entero sin scroll vertical. -->
      <div class="resumen-repaso" data-test="repaso">
        <p class="resumen-repaso-titulo">Para repasar</p>
        <div class="resumen-repaso-carrusel" id="repaso-carrusel"></div>
        <div class="resumen-repaso-puntos" id="repaso-puntos" data-test="repaso-puntos"></div>
        <p class="resumen-repaso-vacio" id="repaso-vacio" data-test="repaso-vacio" hidden>Sin fallos. Nada que repasar.</p>
      </div>
      <div class="resumen-acciones">
        <button class="boton boton-principal" data-test="otra">Otra</button>
        <button class="boton" data-test="inicio">Inicio</button>
      </div>
    </section>

    <!-- HUB: sustituye a "Progreso". Se conservan data-vista="progreso" y
         data-test="progreso" en la sección para no romper referencias, aunque el
         título ya no es "Progreso": es la pantalla desde la que SIEMPRE se
         empieza a jugar (Comenzar al azar, la Misión de hoy, Pendientes, o una
         tarjeta de área = un nivel). Orden de arriba abajo: radar, KPIs, misión +
         pendientes, áreas (4×2), Comenzar (anclado abajo) y el pie. -->
    <section class="vista vista-hub" data-vista="progreso" data-test="progreso" hidden>
      <!-- Radar de las 8 áreas (150px, estilo panel de stats de videojuego): un eje
           por área, contorno = puntuación, relleno más opaco = solidez. -->
      <div class="hub-radar-envoltorio">
        <svg class="hub-radar" data-test="radar" viewBox="0 0 220 220" aria-hidden="true"></svg>
        <p class="radar-vacio" id="radar-vacio" hidden>Juega para dibujar tu perfil</p>
      </div>
      <div class="hub-kpis">
        <span class="hub-chip" data-test="kpi-racha">🔥 0</span>
        <span class="hub-chip" data-test="kpi-aciertos-hoy">Hoy: 0/0</span>
        <span class="hub-chip" data-test="recuperadas">Recuperadas 0</span>
        <span class="hub-chip" data-test="calibracion" hidden></span>
      </div>
      <div class="hub-destacados">
        <button type="button" class="hub-destacado" data-test="mision" aria-disabled="true"></button>
        <button type="button" class="hub-destacado" data-test="pendientes" aria-disabled="true"></button>
      </div>
      <div id="progreso-areas" class="hub-grid"></div>
      <button class="boton boton-principal boton-comenzar" data-test="comenzar">Comenzar</button>
      <div class="hub-pie">
        <button class="enlace" data-test="exportar">Exportar</button>
        <label class="enlace boton-archivo">
          Importar
          <input type="file" id="importar-archivo" accept="application/json" hidden>
        </label>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
