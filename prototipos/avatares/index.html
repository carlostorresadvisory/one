<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Avatares de ONE</title>
<style>
:root{--bg:#0b1220;--card:#0f1a2e;--cy:#22d3ee;--go:#f5b942;--tx:#e6edf7;--mu:#8aa0bd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.3 -apple-system,system-ui,Segoe UI,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;height:100dvh;padding:max(10px,env(safe-area-inset-top)) 16px max(10px,env(safe-area-inset-bottom));gap:10px;max-width:480px;margin:0 auto}
.tabs{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.tabs button{padding:10px 0;border-radius:12px;border:1px solid #1e2c47;background:var(--card);color:var(--mu);font-weight:700;font-size:15px}
.tabs button.on{border-color:var(--cy);color:var(--cy);box-shadow:0 0 12px #22d3ee33}
.hdr{display:flex;align-items:center;gap:10px;padding:6px 4px;font-weight:700}
.hdr .sp{flex:1}.hdr .fire{color:var(--go)}
.hdr .mini{width:33vw;height:16.6vh;display:grid;place-items:center}
.tienda{flex:1;min-height:0;border:1.5px solid var(--cy);border-radius:20px;background:radial-gradient(120% 90% at 50% 25%,#123049 0,var(--card) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;box-shadow:0 0 24px #22d3ee22 inset}
.tienda small{color:var(--mu);letter-spacing:.12em;text-transform:uppercase;font-size:11px}
.big{width:min(210px,46vh);aspect-ratio:1;display:grid;place-items:center}
.big>*,.mini>*{width:100%;height:100%;object-fit:contain;display:block}
.big,.mini{position:relative}.pend{color:var(--mu);font-size:12px}
.tienda h3{margin:0;font-size:18px}.tienda p{margin:0;color:var(--mu);font-size:13px;text-align:center}
.exp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.exp button{padding:11px 0;border-radius:12px;border:1px solid #1e2c47;background:var(--card);color:var(--tx);font-size:13px;font-weight:600}
.exp button.on{border-color:var(--go);color:var(--go)}
.meta{font-size:11.5px;color:var(--mu);line-height:1.35}
.meta b{color:var(--tx)}.meta a{color:var(--cy)}
.owl{transition:filter .3s}
.owl.triste{filter:saturate(.45) brightness(.85) hue-rotate(15deg)}
.owl.euforica{filter:drop-shadow(0 0 14px #f5b942) saturate(1.3) brightness(1.1)}
.owl.contenta{filter:drop-shadow(0 0 8px #22d3ee88)}
</style>
</head>
<body>
<div class="tabs" id="tabs"></div>
<div class="hdr"><span>&larr; ONE</span><span class="fire">&#128293;3</span><span>&#128266;</span><span class="sp"></span><div class="mini" id="mini"></div></div>
<div class="tienda"><small>Tienda</small><div class="big" id="big"></div><h3 id="nm"></h3><p id="ds"></p></div>
<div class="exp" id="exp"></div>
<div class="meta" id="meta"></div>
<script src="b-noto/lottie_light.min.js"></script>
<script>
var EXPR=[['neutral','Neutral'],['contenta','Contenta'],['triste','Triste'],['euforica','Eufórica']];
var OPTS={
A:{n:'Fluent Emoji 3D · gato',d:'Cuatro caras PNG nativas (MIT). Sin animación propia: salto/temblor/brillo con CSS.',
 auth:'Microsoft',lic:'MIT',url:'https://github.com/microsoft/fluentui-emoji',kind:'img',
 src:function(e){return 'a-fluent/'+e+'.png'}},
B:{n:'Noto Emoji animado · gato',d:'Lottie nativo de Google: cada cara se anima sola. Licencia CC BY 4.0 declarada por Google (ver nota).',
 auth:'Google',lic:'CC BY 4.0 (sin verificar en repo)',url:'https://googlefonts.github.io/noto-emoji-animation/',kind:'lottie',
 src:function(e){return 'b-noto/'+e+'.json'}},
C:{n:'DiceBear Fun Emoji · carita',d:'SVG con ojos y boca por expresión, colores ONE (cian/dorado). Atribución obligatoria.',
 auth:'Davis Uche vía DiceBear',lic:'CC BY 4.0',url:'https://github.com/dicebear/styles',kind:'img',
 src:function(e){return 'c-dicebear/'+e+'.svg'}},
D:{n:'Fluent Emoji 3D · búho sabio',d:'Un solo PNG (esfinge/enigma/sabio); la expresión se simula con color, brillo y movimiento CSS.',
 auth:'Microsoft',lic:'MIT',url:'https://github.com/microsoft/fluentui-emoji',kind:'img',owl:1,
 src:function(){return 'd-owl/owl.png'}},
E:{n:'Kabi · toro Rive (esqueleto)',d:'Personaje vectorial con huesos y state machine: 8 estados de ánimo y 29 poses nativos, parpadeo y cola solos. Cabecera = modo solo cabeza.',
 auth:'Bryl Lim',lic:'CC BY 4.0 (atribución obligatoria) · 1,7 MB',url:'https://github.com/bryllim/kabi-mascot',kind:'rive',native:1},
F:{n:'Búho profesor · Lottie',d:'Un solo Lottie (birrete y gafas, sabio). La expresión se simula: velocidad, color y rebote; sin caras propias.',
 auth:'Bashir Ahmad (LottieFiles)',lic:'Lottie Simple License · 41 KB + lottie-web',url:'https://lottiefiles.com/free-animation/professor-owl-kvkfB6kyEu',kind:'lottie1',
 src:function(){return 'f-profesor/profesor.json'},speed:{neutral:.7,contenta:1,triste:.35,euforica:2}},
G:{n:'Robot expresivo · 3D',d:'glTF 3D con clips nativos (Idle, ThumbsUp, Sitting, Dance) y cara con morph targets (Sad, Surprised). three.js local.',
 auth:'Tomás Laulhé (Quaternius) · Don McCurdy',lic:'CC0 1.0 · 1,1 MB',url:'https://github.com/mrdoob/three.js/tree/dev/examples/models/gltf/RobotExpressive',kind:'three',native:1,
 cfg:{url:'g-robot/RobotExpressive.glb',headFrac:.62,clips:{
  neutral:{name:'Idle'},contenta:{name:'ThumbsUp'},triste:{name:'Sitting',once:1,morph:{Sad:1}},euforica:{name:'Dance',morph:{Surprised:.6}}}}},
H:{n:'Mago · 3D low-poly',d:'Mago glTF 3D (sabio/enigma) con clips nativos: Idle, Jump, SitDown, Victory. Sin cara animada.',
 auth:'Quaternius',lic:'CC0 1.0 · 1,2 MB',url:'https://quaternius.com/packs/ultimatedanimatedcharacter.html',kind:'three',native:1,
 cfg:{url:'h-mago/Wizard.glb',headFrac:.5,clips:{
  neutral:{name:'Idle'},contenta:{name:'Jump'},triste:{name:'SitDown',once:1},euforica:{name:'Victory'}}}},
I:{n:'Esfinge ONE · diseño propio',d:'Diseñada por Carlos con Gemini: cuatro expresiones nativas, fondo recortado. Movimiento con CSS.',
 auth:'Carlos Torres (Gemini)',lic:'propia',url:'#',kind:'img',
 src:function(e){return 'i-esfinge/'+e+'.png'}},
J:{n:'Esfinge ONE · animada',d:'Vídeo con transparencia (MP4 stacked alpha en canvas, 24 fps): reposo en bucle; acierto y eufórica de Wan 2.2; triste interpolada con FILM desde la imagen de Gemini.',
 auth:'Carlos Torres (Gemini + Wan 2.2 + FILM)',lic:'propia',url:'#',kind:'mp4'}
};
var B64={};function bin(path){return B64[path]||(B64[path]=fetch(path+'.txt').then(function(r){return r.text()}).then(function(t){var b=atob(t.trim()),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return URL.createObjectURL(new Blob([u]))}))}
var cur='J',ex='neutral',anims=[],dis=[],tok=0,rivePromise;
function loadRive(){return rivePromise||(rivePromise=new Promise(function(ok,ko){var sc=document.createElement('script');sc.src='e-kabi/rive.js';sc.onload=function(){rive.RuntimeLoader.setWasmUrl('e-kabi/rive.wasm');rive.Rive.suppressDeprecationWarnings=['default-state-machine','state-machine-inputs','state-machines-param'];ok()};sc.onerror=ko;document.head.appendChild(sc)}))}
var KABI={neutral:{pose:0,mood:0},contenta:{pose:1,mood:1},triste:{pose:8,mood:4},euforica:{pose:7,mood:1,fire:'jump'}};
function mountRive(el,e,head,t){
 Promise.all([loadRive(),bin('e-kabi/kabi.riv')]).then(function(res){
  if(t!==tok)return;
  var c=document.createElement('canvas');if(!head)c.style.transform='scale(1.45)';el.appendChild(c);
  var r=new rive.Rive({src:res[1],canvas:c,stateMachines:'Kabi',autoplay:true,layout:new rive.Layout({fit:rive.Fit.Contain}),onLoad:function(){
   r.resizeDrawingSurfaceToCanvas();
   var i={};r.stateMachineInputs('Kabi').forEach(function(x){i[x.name]=x});
   var k=KABI[e];i.pose.value=k.pose;i.mood.value=k.mood;i.color.value=1;i.outline.value=true;i.headOnly.value=!!head;i.glasses.value=false;
   if(k.fire)setTimeout(function(){i[k.fire].fire()},300);
  }});
  dis.push(function(){r.cleanup()});
 });
}
function mountThree(el,o,e,head,t){
 Promise.all([import('./g-robot/viewer3d.min.js'),bin(o.cfg.url)]).then(function(res){var m=res[0];
  var cfg=Object.assign({},o.cfg,{url:res[1]});if(!head)cfg.headFrac=1;
  return m.mount3d(el,cfg,e).then(function(h){if(t!==tok){h.dispose();return}dis.push(h.dispose)});
 }).catch(function(err){el.innerHTML='<span class="pend">'+err.message+'</span>'});
}
function mountMp4(el,e,t){
 import('./esfinge-mp4/player.js?v=1').then(function(m){if(t!==tok)return;
  var h=m.montarEsfinge(el,'esfinge-mp4/');dis.push(h.destruir);
  if(e!=='neutral')setTimeout(function(){h.expresion(e)},400);});
}
function mount(el,o,e,loop,head){
 el.innerHTML='';
 if(o.kind==='rive')return mountRive(el,e,head,tok);
 if(o.kind==='three')return mountThree(el,o,e,head,tok);
 if(o.kind==='mp4')return mountMp4(el,e,tok);
 if(o.kind==='lottie1'){
  var a1=lottie.loadAnimation({container:el,renderer:'svg',loop:true,autoplay:true,path:o.src(e)});
  a1.setSpeed(o.speed[e]);anims.push(a1);el.classList.add('owl',e);return;}
 if(o.kind==='lottie'){
  var a=lottie.loadAnimation({container:el,renderer:'svg',loop:loop,autoplay:true,path:o.src(e)});
  anims.push(a);return;}
 var i=new Image();i.src=o.src(e);i.alt='';i.draggable=false;
 if(o.owl)i.className='owl '+e;
 el.appendChild(i);
}
function anim(el,e){
 var k={neutral:[{transform:'scale(1)'},{transform:'scale(1.04)'},{transform:'scale(1)'}],
 contenta:[{transform:'translateY(0)'},{transform:'translateY(-14px)'},{transform:'translateY(0)'}],
 triste:[{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(-4px)'},{transform:'translateX(0)'}],
 euforica:[{transform:'translateY(0) scale(1)'},{transform:'translateY(-26px) scale(1.12) rotate(-6deg)'},{transform:'translateY(0) scale(1)'},{transform:'translateY(-18px) scale(1.1) rotate(6deg)'},{transform:'translateY(0) scale(1)'}]}[e];
 var t={neutral:500,contenta:450,triste:700,euforica:900}[e];
 el.animate(k,{duration:t,easing:'ease-out'});
 if(e==='euforica')el.animate([{filter:'drop-shadow(0 0 0 #f5b942)'},{filter:'drop-shadow(0 0 22px #f5b942)'},{filter:'drop-shadow(0 0 0 #f5b942)'}],{duration:900});
}
function render(){
 var o=OPTS[cur];
 anims.forEach(function(a){a.destroy()});anims=[];dis.forEach(function(f){try{f()}catch(x){}});dis=[];
 var big=document.getElementById('big'),mini=document.getElementById('mini');
 big.className='big';mini.className='mini';
 tok++;mount(big,o,ex,true,false);mount(mini,o,ex,true,true);
 if(!o.native&&cur!=='J'){anim(big,ex);anim(mini,ex)}
 document.getElementById('nm').textContent=o.n;
 document.getElementById('ds').textContent=o.d;
 document.getElementById('meta').innerHTML='<b>'+o.n+'</b> · '+o.auth+' · '+o.lic+' · <a href="'+o.url+'" target="_blank" rel="noopener">repo</a>';
 [].forEach.call(document.querySelectorAll('#tabs button'),function(b){b.classList.toggle('on',b.dataset.k===cur)});
 [].forEach.call(document.querySelectorAll('#exp button'),function(b){b.classList.toggle('on',b.dataset.k===ex)});
}
var tb=document.getElementById('tabs'),eb=document.getElementById('exp');
Object.keys(OPTS).forEach(function(k){var b=document.createElement('button');b.textContent=k;b.dataset.k=k;b.onclick=function(){cur=k;render()};tb.appendChild(b)});
EXPR.forEach(function(p){var b=document.createElement('button');b.textContent=p[1];b.dataset.k=p[0];b.onclick=function(){ex=p[0];render()};eb.appendChild(b)});
render();
</script>
</body>
</html>
